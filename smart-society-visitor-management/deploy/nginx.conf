# Serves the Angular SPA; proxies /api to Django. HTTPS: mount certs at
# /etc/nginx/ssl/cert.pem and /etc/nginx/ssl/key.pem, then uncomment the 443 block.
upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # --- HTTPS (enable by mounting certs and uncommenting) ---
    # server {
    #     listen 443 ssl;
    #     server_name society.example.com;
    #     ssl_certificate     /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     location /api/ { proxy_pass http://api; proxy_set_header Host $host; }
    #     location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
    # }
}
